<!DOCTYPE html>
<html lang="th" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Portal - พอร์ทัลพนักงาน</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Kanit Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Kanit', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-200">

    <!-- Header Banner -->
    <header class="bg-indigo-700 dark:bg-indigo-900 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center backdrop-blur-sm">
                    <i class="fa-solid fa-square-poll-vertical text-2xl text-indigo-200"></i>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold tracking-tight">Employee Portal</h1>
                    <p class="text-xs text-indigo-200 hidden sm:block">ศูนย์รวมระบบงานและลิงก์สำหรับพนักงาน</p>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <!-- Refresh Button -->
                <button onclick="fetchSheetData()" title="รีเฟรชข้อมูล" 
                        class="p-2.5 rounded-lg bg-white/10 hover:bg-white/20 transition text-indigo-100 flex items-center gap-2 text-sm font-medium">
                    <i id="refreshIcon" class="fa-solid fa-arrows-rotate"></i>
                    <span class="hidden md:inline">อัปเดตข้อมูล</span>
                </button>

                <!-- Dark Mode Toggle -->
                <button id="themeToggle" onclick="toggleTheme()" title="สลับโหมดมืด/สว่าง"
                        class="p-2.5 rounded-lg bg-white/10 hover:bg-white/20 transition text-indigo-100">
                    <i id="themeIcon" class="fa-solid fa-moon"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">
        
        <!-- Controls: Search & Category Filter -->
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200/80 dark:border-slate-700 p-4 mb-8">
            <div class="flex flex-col md:flex-row gap-4 justify-between items-center">
                
                <!-- Search Input -->
                <div class="relative w-full md:w-96">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="searchInput" oninput="filterCards()" 
                           placeholder="ค้นหาระบบงาน หรือคำอธิบาย..." 
                           class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm transition">
                </div>

                <!-- Category Filters (Generated Dynamically) -->
                <div id="categoryFilters" class="flex flex-wrap gap-2 w-full md:w-auto justify-start md:justify-end">
                    <button onclick="setCategory('ALL')" class="cat-btn active text-xs font-medium px-3.5 py-2 rounded-xl transition border bg-indigo-600 text-white border-indigo-600">
                        ทั้งหมด
                    </button>
                </div>

            </div>
        </div>

        <!-- Loading State Indicator -->
        <div id="loading" class="flex flex-col items-center justify-center py-16 text-indigo-600 dark:text-indigo-400">
            <i class="fa-solid fa-circle-notch fa-spin text-4xl mb-4"></i>
            <p class="text-sm font-medium animate-pulse">กำลังโหลดข้อมูลระบบงาน...</p>
        </div>

        <!-- Links Grid Container -->
        <div id="linksGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 hidden">
            <!-- Cards will be injected here via JavaScript -->
        </div>

        <!-- Empty / Error State Container -->
        <div id="emptyState" class="hidden text-center py-16 text-slate-400 dark:text-slate-500">
            <i class="fa-solid fa-folder-open text-5xl mb-4"></i>
            <p id="emptyMessage" class="text-base font-medium">ไม่พบระบบงานที่ค้นหา</p>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 py-6 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-500 dark:text-slate-400">
            <p>© Internal Employee Portal System • พัฒนาเพื่อการใช้งานภายในองค์กร</p>
        </div>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        // =========================================================================
        // ⚠️ วาง URL ของ Google Apps Script Web App (ลงท้ายด้วย /exec) ตรงนี้
        // =========================================================================
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbw0nmSGqhHyTbXCOteOnfWV_XiaoBcea8WdwMsY_QqP_PDXp4DJ9PNFRCg_mR2g7NLb/exec';

        let allLinks = [];
        let currentCategory = 'ALL';

        // 1. Fetch Data from Apps Script
        async function fetchSheetData() {
            const loadingEl = document.getElementById('loading');
            const gridEl = document.getElementById('linksGrid');
            const emptyEl = document.getElementById('emptyState');
            const refreshIcon = document.getElementById('refreshIcon');

            loadingEl.classList.remove('hidden');
            gridEl.classList.add('hidden');
            emptyEl.classList.add('hidden');
            refreshIcon.classList.add('fa-spin');

            try {
                const response = await fetch(GAS_URL);
                if (!response.ok) throw new Error('Network response was not ok');
                
                allLinks = await response.json();
                
                generateCategoryButtons(allLinks);
                filterCards();
            } catch (error) {
                console.error("Error fetching data:", error);
                document.getElementById('emptyMessage').innerText = 'ไม่สามารถดึงข้อมูลได้ กรุณาตรวจสอบการตั้งค่า Apps Script URL';
                emptyEl.classList.remove('hidden');
            } finally {
                loadingEl.classList.add('hidden');
                refreshIcon.classList.remove('fa-spin');
            }
        }

        // 2. Render Link Cards
        function renderCards(links) {
            const gridEl = document.getElementById('linksGrid');
            const emptyEl = document.getElementById('emptyState');

            gridEl.innerHTML = '';

            if (links.length === 0) {
                gridEl.classList.add('hidden');
                document.getElementById('emptyMessage').innerText = 'ไม่พบระบบงานที่ค้นหา';
                emptyEl.classList.remove('hidden');
                return;
            }

            emptyEl.classList.add('hidden');
            gridEl.classList.remove('hidden');

            links.forEach(item => {
                const iconClass = item.icon ? item.icon.trim() : 'fa-link';
                const category = item.category || 'ทั่วไป';
                const description = item.description || '-';
                
                const card = document.createElement('div');
                card.className = "bg-white dark:bg-slate-800 rounded-2xl shadow-sm hover:shadow-md border border-slate-200/80 dark:border-slate-700/80 p-5 flex flex-col justify-between transition-all duration-200 transform hover:-translate-y-1 group";

                card.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between mb-4">
                            <div class="w-12 h-12 rounded-xl bg-indigo-50 dark:bg-indigo-900/40 text-indigo-600 dark:text-indigo-400 flex items-center justify-center text-xl group-hover:scale-110 transition-transform">
                                <i class="fa-solid ${iconClass}"></i>
                            </div>
                            <span class="text-xs font-medium px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-700/60 text-slate-600 dark:text-slate-300 border border-slate-200/60 dark:border-slate-600/40">
                                ${category}
                            </span>
                        </div>
                        <h3 class="text-base font-bold text-slate-800 dark:text-slate-100 mb-1 line-clamp-1 group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition-colors">${item.title}</h3>
                        <p class="text-xs text-slate-500 dark:text-slate-400 mb-5 line-clamp-2 leading-relaxed">${description}</p>
                    </div>
                    <a href="${item.url}" target="_blank" rel="noopener noreferrer" 
                       class="w-full inline-flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-xl transition text-xs shadow-sm shadow-indigo-200 dark:shadow-none">
                        เข้าสู่ระบบ <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                    </a>
                `;
                gridEl.appendChild(card);
            });
        }

        // 3. Category Buttons Generator
        function generateCategoryButtons(links) {
            const categories = ['ALL', ...new Set(links.map(l => l.category || 'ทั่วไป'))];
            const filterContainer = document.getElementById('categoryFilters');
            
            filterContainer.innerHTML = '';
            categories.forEach(cat => {
                const btn = document.createElement('button');
                const isSelected = cat === currentCategory;
                btn.className = `cat-btn text-xs font-medium px-3.5 py-2 rounded-xl transition border ${
                    isSelected 
                    ? 'bg-indigo-600 text-white border-indigo-600' 
                    : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700'
                }`;
                btn.innerText = cat === 'ALL' ? 'ทั้งหมด' : cat;
                btn.onclick = () => setCategory(cat);
                filterContainer.appendChild(btn);
            });
        }

        // 4. Set Selected Category
        function setCategory(cat) {
            currentCategory = cat;
            generateCategoryButtons(allLinks);
            filterCards();
        }

        // 5. Search & Filter Logic
        function filterCards() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const filtered = allLinks.filter(item => {
                const matchCategory = (currentCategory === 'ALL') || (item.category === currentCategory);
                const matchQuery = item.title.toLowerCase().includes(query) || 
                                   (item.description && item.description.toLowerCase().includes(query)) ||
                                   (item.category && item.category.toLowerCase().includes(query));
                return matchCategory && matchQuery;
            });
            renderCards(filtered);
        }

        // 6. Theme Toggle (Light / Dark Mode)
        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            const themeIcon = document.getElementById('themeIcon');
            themeIcon.className = isDark ? 'fa-solid fa-sun text-amber-300' : 'fa-solid fa-moon';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        // Initialize Theme from LocalStorage
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.getElementById('themeIcon').className = 'fa-solid fa-sun text-amber-300';
        }

        // Load data on start
        window.addEventListener('DOMContentLoaded', fetchSheetData);
    </script>
</body>
</html>
