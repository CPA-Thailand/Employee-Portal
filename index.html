<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root{
    --pri:#183d5f; --pri-dark:#0f2840; --pri-100:#d5e2ef; --pri-50:#eef3f8;
    --acc:#b5231d; --acc-50:#fbf1f0;
    --ink:#1e293b; --muted:#5f6b7a; --line:#dfe5ec; --bg:#f9fafb; --card:#ffffff; --r:9px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Sarabun',sans-serif;font-size:16px;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}

  .topbar{background:#fff;border-bottom:3px solid var(--acc);box-shadow:0 2px 8px rgba(24,61,95,.08)}
  .topbar-inner{max-width:1100px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .logos{display:flex;align-items:center;gap:14px}
  .logos img{height:46px;width:auto;display:block}
  .title{flex:1;min-width:200px}
  .title h1{margin:0;font-size:1.45rem;font-weight:600;color:var(--pri)}
  .title p{margin:2px 0 0;font-size:.85rem;color:var(--muted)}
  .refresh{border:1px solid var(--line);background:var(--pri-50);color:var(--pri);border-radius:var(--r);padding:9px 14px;font:inherit;font-size:.9rem;cursor:pointer}
  .refresh:hover{background:var(--pri-100)}
  .refresh:focus-visible,.cat:focus-visible,#q:focus-visible,.go:focus-visible{outline:3px solid #93a9c2;outline-offset:2px}

  main{max-width:1100px;margin:0 auto;padding:24px 20px 40px;width:100%;flex:1}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:22px;box-shadow:0 1px 3px rgba(24,61,95,.05)}
  .search{position:relative}
  .search i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#94a3b8}
  #q{width:100%;padding:11px 14px 11px 40px;border:1px solid var(--line);border-radius:var(--r);font:inherit;font-size:1rem;background:var(--bg)}
  .cats{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .cat{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:6px 14px;font:inherit;font-size:.88rem;cursor:pointer}
  .cat:hover{background:var(--pri-50)}
  .cat.on{background:var(--pri);border-color:var(--pri);color:#fff}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;justify-content:space-between;gap:14px}
  .card-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .ico{width:44px;height:44px;border-radius:var(--r);background:var(--pri-50);color:var(--pri);display:flex;align-items:center;justify-content:center;font-size:1.15rem;flex:none}
  .tag{font-size:.78rem;color:var(--acc);background:var(--acc-50);border:1px solid #f0d4d2;border-radius:6px;padding:2px 8px}
  .card h3{margin:0 0 4px;font-size:1.08rem;font-weight:600;color:var(--pri-dark)}
  .card p{margin:0;font-size:.9rem;color:var(--muted);line-height:1.5}
  .go{display:block;text-align:center;text-decoration:none;background:var(--pri);color:#fff;border-radius:var(--r);padding:9px;font-size:.95rem;font-weight:500}
  .go:hover{background:var(--pri-dark)}

  .state{text-align:center;padding:48px 16px;color:var(--muted)}
  .state i{font-size:2.4rem;margin-bottom:10px;color:var(--pri)}
  .hidden{display:none!important}
  .notice{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:var(--r);padding:12px 14px;font-size:.92rem;margin-bottom:16px}

  footer{text-align:center;font-size:.8rem;color:var(--muted);padding:18px;border-top:1px solid var(--line);background:#fff}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="logos" id="logos"></div>
    <div class="title">
      <h1>CPA Staff Portal</h1>
      <p>ศูนย์รวมระบบงานและลิงก์สำหรับพนักงาน</p>
    </div>
    <button class="refresh" onclick="load()"><i id="spin" class="fa-solid fa-arrows-rotate"></i> อัปเดตข้อมูล</button>
  </div>
</header>

<main>
  <div class="panel">
    <div class="search">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input id="q" type="search" placeholder="ค้นหาระบบงาน หรือคำอธิบาย..." oninput="render()">
    </div>
    <div class="cats" id="cats"></div>
  </div>

  <div id="error" class="notice hidden"></div>
  <div id="loading" class="state"><i class="fa-solid fa-circle-notch fa-spin"></i><p>กำลังโหลดข้อมูลระบบงาน...</p></div>
  <div id="grid" class="grid hidden"></div>
  <div id="empty" class="state hidden"><i class="fa-solid fa-folder-open"></i><p>ไม่พบระบบงานที่ค้นหา</p></div>
</main>

<footer>© Internal Staff Portal • สำหรับพนักงานภายในองค์กรเท่านั้น</footer>

    { src: '', alt: 'TOEIC' }
  ];

  let links = [], cat = 'ALL';
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const safeUrl = u => /^https?:\/\//i.test(String(u).trim()) ? String(u).trim() : '#';

  $('logos').innerHTML = LOGOS.filter(l => l.src).map(l => `<img src="${esc(l.src)}" alt="${esc(l.alt)}">`).join('');

  async function load() {
    $('loading').classList.remove('hidden');
    $('grid').classList.add('hidden');
    $('empty').classList.add('hidden');
    $('error').classList.add('hidden');
    $('spin').classList.add('fa-spin');
    try {
      const r = await fetch(GAS_URL);
      if (!r.ok) throw new Error(r.status);
      links = await r.json();
      render();
    } catch (e) {
      console.error(e);
      $('error').textContent = 'ไม่สามารถดึงข้อมูลได้ กรุณาลองใหม่อีกครั้ง หรือตรวจสอบการตั้งค่า Apps Script (Deploy เป็น Anyone)';
      $('error').classList.remove('hidden');
    } finally {
      $('loading').classList.add('hidden');
      $('spin').classList.remove('fa-spin');
    }
  }

  function buildCats() {
    const list = ['ALL', ...new Set(links.map(l => l.category || 'ทั่วไป'))];
    $('cats').innerHTML = '';
    list.forEach(c => {
      const b = document.createElement('button');
      b.className = 'cat' + (c === cat ? ' on' : '');
      b.textContent = c === 'ALL' ? 'ทั้งหมด' : c;
      b.onclick = () => { cat = c; render(); };
      $('cats').appendChild(b);
    });
  }

  function render() {
    buildCats();
    const q = $('q').value.toLowerCase().trim();
    const rows = links.filter(i => {
      const c = i.category || 'ทั่วไป';
      return (cat === 'ALL' || c === cat) &&
        [i.title, i.description, c].some(t => String(t || '').toLowerCase().includes(q));
    });
    $('grid').innerHTML = rows.map(i => `
      <div class="card">
        <div>
          <div class="card-top">
            <div class="ico"><i class="fa-solid ${esc((i.icon || 'fa-link').trim())}"></i></div>
            <span class="tag">${esc(i.category || 'ทั่วไป')}</span>
          </div>
          <h3>${esc(i.title)}</h3>
          <p>${esc(i.description || '-')}</p>
        </div>
        <a class="go" href="${esc(safeUrl(i.url))}" target="_blank" rel="noopener noreferrer">เข้าสู่ระบบ <i class="fa-solid fa-arrow-up-right-from-square"></i></a>
      </div>`).join('');
    $('grid').classList.toggle('hidden', rows.length === 0);
    $('empty').classList.toggle('hidden', rows.length !== 0);
  }

  load();
</script>
